# Set PENGU_DOMAIN in .env, then run `docker compose up -d --build`.
services:
  server:
    image: ${PENGU_IMAGE:-bomberpengu:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: ["caddy", "reverse-proxy", "--from", "${PENGU_DOMAIN:?Set PENGU_DOMAIN to your public hostname}", "--to", "server:8080"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
