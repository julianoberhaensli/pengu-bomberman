[package]
name = "bomberpengu"
version = "0.1.0"
edition = "2021"
description = "Native Rust rewrite of the Flash game Bomber Pengu"
default-run = "bomberpengu"

[lib]
name = "bomberpengu"
path = "src/lib.rs"

[[bin]]
name = "bomberpengu"
path = "src/main.rs"

[[bin]]
name = "bomberpengu-server"
path = "src/server_main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = true, features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.30"
